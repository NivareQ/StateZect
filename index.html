<!doctype html>
<html lang="en" data-pulse-build="nivareq-pulse-statezect-public-v1-0-0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#090b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StateZect">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>StateZect</title>
  <link rel="manifest" href="./manifest.webmanifest?v=statezect-public-v1-0-0">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=statezect-public-v1-0-0">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png?v=statezect-public-v1-0-0">
  <link rel="stylesheet" href="./styles.css?v=statezect-public-v1-0-0">
  <script>
    // Theme bootstrap runs before first paint. Night preserves the accepted
    // Foundation appearance; all curated themes use the same token registry.
    try {
      const savedTheme = localStorage.getItem('nivareq-pulse-theme');
      const themeColors = {day:'#f4f6fb',night:'#090b12',oled:'#000000',dusk:'#15101d',ocean:'#07131a',forest:'#09140f',ember:'#160d09',plum:'#160b16',sand:'#f4efe6'};
      const theme = Object.prototype.hasOwnProperty.call(themeColors, savedTheme) ? savedTheme : 'night';
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').setAttribute('content', themeColors[theme]);
    } catch { document.documentElement.dataset.theme = 'night'; }
  </script>
  <script>
    // iOS can report a transient safe-area value during a cold standalone launch.
    // Use one stable accepted bottom-bar inset for installed mode instead of
    // letting that transient environment value move the navigation controls.
    if (navigator.standalone === true || matchMedia('(display-mode: standalone)').matches) {
      document.documentElement.classList.add('pwa-standalone');
    }
  </script>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script>
    // Installed-app interaction guard: preserve one-finger vertical scrolling,
    // but suppress iOS pinch/gesture zoom so the UI behaves like an app shell.
    for (const type of ['gesturestart','gesturechange','gestureend']) {
      document.addEventListener(type, event => event.preventDefault(), { passive: false });
    }
    document.addEventListener('touchmove', event => {
      if (event.touches && event.touches.length > 1) event.preventDefault();
    }, { passive: false });
  </script>
  <script type="module" src="./src/app.js?v=statezect-public-v1-0-0"></script>
</body>
</html>
